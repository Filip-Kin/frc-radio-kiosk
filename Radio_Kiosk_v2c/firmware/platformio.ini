; FRC radio kiosk v2 firmware, STM32F072CBT6 on the v2 board.
; Build:  pio run          Flash over USB DFU: hold BOOT0, tap RESET, then
;         pio run -t upload   (upload_protocol dfu) or SWD via J9.
[env:kiosk]
platform = ststm32
board = elektor_f072cb          ; a plain STM32F072CBT6, 128 kB, 48 MHz, HSI48 USB
framework = arduino
upload_protocol = dfu
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12
    bblanchon/ArduinoJson@^7
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    -D USBD_VID=0x0483
    -D USBD_PID=0x5740
    -D USB_MANUFACTURER="\"Filip Kin\""
    -D USB_PRODUCT="\"Radio Kiosk v2\""
    -D HAL_PCD_MODULE_ENABLED
    -D SERIAL_UART_INSTANCE=1
    -D PIN_SERIAL_TX=PB6
    -D PIN_SERIAL_RX=PB7
    -Os
